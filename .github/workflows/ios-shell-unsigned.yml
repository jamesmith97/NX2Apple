
name: Build NX2Apple Shell IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-shell:
    runs-on: macos-26
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check Xcode
        run: xcodebuild -version

      - name: Install dependencies
        run: |
          brew install xcodegen zstd spirv-cross glslang

      - name: Set up Python
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install lz4 capstone fonttools zbic nsz

      - name: Sync NX2Apple engine
        run: |
          .venv/bin/python tools/engine.py sync

      - name: Prepare Shell-only build
        run: |
          sed -i '' 's/if not paths: sys.exit(.*)/if not paths: pass/' frontend-ios/Shell/build_shell.sh
          grep -n "if not paths" frontend-ios/Shell/build_shell.sh
          mkdir -p "$RUNNER_TEMP/empty-frameworks"

      - name: Build NX2Apple Shell
        env:
          SHELL_DIR: ${{ runner.temp }}/NX2AppleShell
          DM_ENGINE_DIR: ${{ github.workspace }}/engine
          DM_SHELL_PACKAGE: ${{ github.workspace }}/frontend-ios
          DM_SHELL_FRAMEWORKS: ${{ runner.temp }}/empty-frameworks
          DM_ENTITLEMENTS: ""
        run: |
          bash frontend-ios/Shell/build_shell.sh --build

      - name: Package IPA
        run: |
          APP="$RUNNER_TEMP/NX2AppleShell/dd/Build/Products/Release-iphoneos/DmShell.app"
          test -x "$APP/DmShell"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry NX2Apple-Shell-unsigned.ipa Payload
          unzip -t NX2Apple-Shell-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: NX2Apple-Shell-unsigned
          path: NX2Apple-Shell-unsigned.ipa
          if-no-files-found: error
